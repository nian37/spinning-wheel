<title>真心话大冒险转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    background: radial-gradient(1200px 800px at 50% -10%, #4b2e83, #241b3e 55%, #14102a);

    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    padding: 24px;
    color: #fff;
    overflow-x: hidden;
    overflow-y: auto;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #7bd8ff, #ff8fa3, #7bd8ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(120, 190, 255, 0.25);
  }

  .stage { position: relative; }

  /* 指针 */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 44px solid #ffd76e;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }
  .pointer::after {
    content: "";
    position: absolute;
    top: -40px;
    left: -10px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 34px solid #fff5d6;
  }

  .wheel-wrap {
    position: relative;
    width: min(420px, 86vw);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    padding: 16px;
    background: conic-gradient(from 0deg,
      #5b9bff, #7bd8ff, #ff5e7a, #ff8fa3,
      #5b9bff, #7bd8ff, #ff5e7a, #ff8fa3);
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.25);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #d8c9f0 60%, #b9a2e6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.15);
  }
  .hub span {
    font-size: 24px;
    font-weight: 700;
    color: #6b4da8;
    cursor: pointer;
    user-select: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }

  .btn {
    margin-top: 28px;
    padding: 12px 48px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #fff;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    background: linear-gradient(135deg, #5b9bff, #ff5e7a);
    box-shadow: 0 8px 22px rgba(110, 120, 255, .4);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(110, 120, 255, .5); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn-row { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .btn-row .btn { margin-top: 0; }
  .btn-ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: none;
    padding: 10px 20px;
    font-size: 14px;
    letter-spacing: 2px;
  }
  .btn-ghost:hover { box-shadow: none; border-color: #7bd8ff; color: #7bd8ff; }
  .btn-small { padding: 8px 18px; font-size: 14px; letter-spacing: 2px; }
  .back-btn { margin-bottom: 14px; }

  /* 抽人名单管理 */
  .people-manage { margin-top: 22px; width: min(420px, 86vw); margin-left: auto; margin-right: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 8px 5px 14px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(91,155,255,.25), rgba(255,94,122,.25));
    border: 1px solid rgba(255,255,255,.25); color: #fff; font-size: 14px;
  }
  .chip button {
    border: none; background: none; color: rgba(255,255,255,.6);
    font-size: 13px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  .chip button:hover { color: #ff5e7a; }
  .people-add { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .people-add input {
    flex: 1; max-width: 150px; padding: 8px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
    color: #fff; font-size: 14px; outline: none; text-align: center;
  }
  .people-add input::placeholder { color: rgba(255,255,255,.4); }

  /* 结果弹窗 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.8);
    background: rgba(20, 14, 40, .96);
    border: 2px solid #7bd8ff;
    border-radius: 18px;
    padding: 28px 38px;
    text-align: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .25s;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    max-width: 86vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  .toast h2 {
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 14px;
  }
  .toast p {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .toast .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .toast .actions button {
    padding: 8px 24px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 2px;
    border: 1px solid #7bd8ff;
    background: transparent;
    color: #7bd8ff;
    transition: background .15s, color .15s;
  }
  .toast .actions button:hover { background: #7bd8ff; color: #14102a; }
  .toast .actions .close { border-color: rgba(255,255,255,.4); color: rgba(255,255,255,.7); }
  .toast .actions .close:hover { background: rgba(255,255,255,.9); color: #14102a; }

  .hint {
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,.55);
    letter-spacing: 1px;
  }
  .hint b { color: #7bd8ff; }
</style>

/* 主转盘：326 道题 + 100 个「直接喝酒」均匀混排 */
const QS = [...TRUTHS, ...DARES];
const DRINK_COUNT = 100;
const ITEMS = [];
{
  const step = (QS.length + DRINK_COUNT) / DRINK_COUNT;
  let next = step, qi = 0, drinks = 0;
  for (let i = 0; i < QS.length + DRINK_COUNT; i++) {
    if (i + 1 >= next && drinks < DRINK_COUNT) {
      ITEMS.push("直接喝酒");
      drinks++;
      next += step;
    } else {
      ITEMS.push(QS[qi++]);
    }
  }
}
const N = ITEMS.length;
const PALETTE = ["#4f8fff", "#7bd8ff", "#ff5e7a", "#ff8fa3", "#ffd76e", "#9d7bff"];

function loadPeople() {
  try {
    const raw = localStorage.getItem(PEOPLE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) return arr;
    }

  return [...PEOPLE_DEFAULT];
}

/* ---------- 语音朗读 ---------- */
let zhVoice = null;
function loadZhVoice() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => /zh/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  loadZhVoice();
  speechSynthesis.onvoiceschanged = loadZhVoice; // 中文语音列表异步加载
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  if (zhVoice) u.voice = zhVoice;
  u.rate = 1;
  speechSynthesis.speak(u);
  // Chrome 的合成器会“休眠”，需要 resume 唤醒才能发声
  speechSynthesis.resume();
}

/* ---------- 通用盘面绘制 ---------- */
function sizeCanvasFor(c) {
  const dpr = window.devicePixelRatio || 1;
  const size = c.clientWidth;
  c.width = size * dpr;
  c.height = size * dpr;
  const ctx = c.getContext("2d");
  // 关键：把逻辑坐标放大到物理像素，否则高分屏上图形只画在左上角、被拉伸变形
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
window.addEventListener("resize", () => { drawWheel(); drawDrinkWheel(); drawPeopleWheel(); });

function drawSegments(canvas, items, angle, colorOf) {
  const size = canvas.clientWidth;
  if (size <= 0 || !items.length) return; // 隐藏画布或空名单跳过绘制
  const ctx = sizeCanvasFor(canvas);
  const cx = size / 2, cy = size / 2;
  const r = size / 2 - 2;
  const slice = (Math.PI * 2) / items.length;

  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // 扇区足够宽才绘制文字（题目很多时，文字改由弹窗展示）
  const showText = slice > 0.16;
  const fontSize = Math.min(15, Math.max(9, r * slice * 0.55));

  for (let i = 0; i < items.length; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, i * slice, (i + 1) * slice);
    ctx.closePath();
    ctx.fillStyle = colorOf(i, items[i]);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = items.length > 40 ? 0.8 : 2;
    ctx.stroke();

    if (showText) {
      ctx.save();
      ctx.rotate(i * slice + slice / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${fontSize}px 'PingFang SC', 'Microsoft YaHei', sans-serif`;
      ctx.shadowColor = "rgba(0,0,0,.3)";
      ctx.shadowBlur = 2;
      ctx.fillText(items[i], r - 20, fontSize * 0.35);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawWheel() {
  drawSegments(canvas, ITEMS, currentAngle, (i, item) =>
    item === "直接喝酒" ? "#ff2d55" : PALETTE[i % PALETTE.length]);
}
function drawDrinkWheel() {
  drawSegments(canvasDrink, DRINK_WHEEL, drinkAngle, i => DRINK_COLORS[i % DRINK_COLORS.length]);
}
function drawPeopleWheel() {
  if (!people.length) return;
  drawSegments(canvasPeople, people, peopleAngle, i => PALETTE[i % PALETTE.length]);
}

/* ---------- 主转盘 ---------- */
function spin() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  hubText.textContent = "…";

  const extraTurns = 5 + Math.random() * 5;
  const target = currentAngle + extraTurns * Math.PI * 2 + Math.random() * Math.PI * 2;
  const startAngle = currentAngle;
  const duration = 4000;
  const startTime = performance.now();

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    currentAngle = startAngle + (target - startAngle) * easeOutQuart(t);
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      hubText.textContent = "GO";
      onMainResult();
    }
  }
  requestAnimationFrame(frame);
}

function onMainResult() {
  const slice = (Math.PI * 2) / N;
  let a = (-currentAngle - Math.PI / 2) % (Math.PI * 2);
  if (a < 0) a += Math.PI * 2;
  const item = ITEMS[Math.floor(a / slice) % N];

  if (item === "直接喝酒") {
    // 跳到「喝几杯」转盘并自动转动
    stageMain.style.display = "none";
    stageDrink.style.display = "";
    toast.classList.remove("show");
    toastBack.style.display = "none";
    setTimeout(spinDrink, 500);
    return;
  }

  toastTitle.textContent = "🎯 你的题目";
  toastText.textContent = item;
  toast.classList.add("show");
  speak(item);
}

  let a = (-peopleAngle - Math.PI / 2) % (Math.PI * 2);
  if (a < 0) a += Math.PI * 2;
  const item = people[Math.floor(a / slice) % people.length];

  toastTitle.textContent = "🎯 抽中人选";
  toastText.textContent = item;
  toastBack.style.display = "none";

function renderChips() {
  const box = document.getElementById("peopleChips");
  box.innerHTML = "";
  people.forEach((p, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = p;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.addEventListener("click", () => {
      people.splice(i, 1);
      savePeople();
      renderChips();
      drawPeopleWheel();
    });
    chip.appendChild(del);
    box.appendChild(chip);
  });
}

function addPerson() {
  const input = document.getElementById("peopleInput");
  const v = input.value.trim();
  if (!v || people.includes(v) || people.length >= 24) { input.value = ""; return; }
  people.push(v);
  input.value = "";
  savePeople();
  renderChips();
  drawPeopleWheel();
}

  stageMain.style.display = "";
});

document.getElementById("toastClose").addEventListener("click", () => {
  toast.classList.remove("show");
});

spinBtn.addEventListener("click", spin);
hubText.addEventListener("click", spin);
hubDrinkText.addEventListener("click", spinDrink);
hubPeopleText.addEventListener("click", spinPeople);

/* 进入 / 退出抽人转盘 */
document.getElementById("peopleBtn").addEventListener("click", () => {
  stageMain.style.display = "none";
  stageDrink.style.display = "none";
  stagePeople.style.display = "";
  toast.classList.remove("show");
  drawPeopleWheel();
  setTimeout(spinPeople, 500);
});
document.getElementById("peopleBackBtn").addEventListener("click", () => {
  toast.classList.remove("show");
  stagePeople.style.display = "none";
  stageMain.style.display = "";
});
document.getElementById("peopleAddBtn").addEventListener("click", addPerson);
document.getElementById("peopleInput").addEventListener("keydown", e => { if (e.key === "Enter") addPerson(); });
document.getElementById("peopleResetBtn").addEventListener("click", () => {
  people = [...PEOPLE_DEFAULT];
  savePeople();
  renderChips();
  drawPeopleWheel();
});

renderChips();
drawWheel();
drawDrinkWheel();
drawPeopleWheel();
</script>
</body>
</html>
